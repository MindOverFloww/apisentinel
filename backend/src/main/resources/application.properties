spring.application.name=api-sentinel

server.port=${SERVER_PORT:8080}

# Database
# Default: Standalone persistent H2 database with PostgreSQL compatibility (zero setup needed)
# Cloud / Custom: Set DB_URL (e.g. Supabase, Neon, AWS, or local PostgreSQL), DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/sentineldb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# H2 Console (available at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT configuration
jwt.secret=${JWT_SECRET:ceaORHQkCSVkA61jpJCseSyBBUETzibdu4uSPK9InlgyIBeRsSxQyV+bet+vhOrn}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
