
spring.application.name=api-sentinel

server.port=${SERVER_PORT:8080}

# PostgreSQL
# Note: prepareThreshold=0 is required for Supabase transaction pooler (PgBouncer)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/api_sentinel?prepareThreshold=0}
spring.datasource.username=${DB_USERNAME:sentinel_user}
spring.datasource.password=${DB_PASSWORD:sabsbdadondj1}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT configuration
jwt.secret=${JWT_SECRET:ceaORHQkCSVkA61jpJCseSyBBUETzibdu4uSPK9InlgyIBeRsSxQyV+bet+vhOrn}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
